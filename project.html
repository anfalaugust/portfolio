<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project | Anfal Alobeid</title>
  <meta name="description" content="Project details from Anfal Alobeid's portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-project">
  <div class="bg" aria-hidden="true">
    <div class="glow one"></div>
    <div class="glow two"></div>
  </div>

  <header>
    <a href="projects.html" class="back-btn" aria-label="Back to projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Projects
    </a>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </header>

  <main id="content"></main>

  <script src="projects.js"></script>
  <script>
    // ----- Dark mode toggle -----
    const root = document.documentElement;
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    // ----- Icons -----
    const ICON = {
      github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>',
      demo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
      course: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>',
      team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5a5 5 0 0 1 4.5 5"/></svg>',
      role: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z"/></svg>',
      overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
      tasks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
      features: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
      tech: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
      figma: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H8.5a3.5 3.5 0 0 0 0 7H12zM12 9H8.5a3.5 3.5 0 0 0 0 7H12zM12 16H8.5A3.5 3.5 0 1 0 12 19.5zM12 2h3.5a3.5 3.5 0 0 1 0 7H12z"/><circle cx="15.5" cy="12.5" r="3.5"/></svg>',
      paper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
    };

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const id = new URLSearchParams(location.search).get('id');
    const p = PROJECTS.find(x => x.id === id) || (id ? null : PROJECTS[0]);
    const main = document.getElementById('content');

    if (!p) {
      main.innerHTML = `
        <div class="not-found">
          <h1>Project not found</h1>
          <p>This project doesn't exist or was moved.</p>
          <a class="btn primary" href="projects.html">${ICON.back} Back to projects</a>
        </div>`;
    } else {
      document.title = p.title + ' | Anfal Alobeid';
      const section = (icon, title, body) =>
        `<section class="d-section reveal"><h2><span class="ic">${ICON[icon]}</span>${esc(title)}</h2>${body}</section>`;

      main.innerHTML = `
        <div class="d-hero">
          <div class="reveal d1">
            <div class="eyebrow">${esc(p.course)}</div>
            <h1 class="${p.title.length > 16 ? 'long' : ''}">${esc(p.title)}</h1>
            <div class="d-sub">${esc(p.subtitle)}</div>
            ${p.fullTitle ? `<p class="d-full"><b>Full title:</b> ${esc(p.fullTitle)}</p>` : ''}
            <div class="d-chips">
              <span class="fact">${ICON.course}${esc((p.courseShort || p.course.split('–')[0].trim()))}</span>
              ${p.type ? `<span class="fact">${ICON.team}${esc(p.type)}</span>` : ''}
              ${p.role ? `<span class="fact">${ICON.role}${esc(p.role)}</span>` : ''}
            </div>
            <div class="d-actions">
              ${p.github ? `<a class="btn primary" href="${esc(p.github)}" target="_blank" rel="noopener">${ICON.github} View on GitHub</a>` : ''}
              ${p.demo ? `<a class="btn" href="${esc(p.demo)}" target="_blank" rel="noopener">${ICON.demo} Live demo</a>` : ''}
              ${p.paper ? `<a class="btn ${p.github || p.prototype ? '' : 'primary'}" href="${esc(p.paper)}" target="_blank" rel="noopener">${ICON.paper} Read the paper</a>` : ''}
              ${p.prototype ? `<a class="btn ${p.github ? '' : 'primary'}" href="${esc(p.prototype)}" target="_blank" rel="noopener">${ICON.figma} View prototype</a>` : ''}
            </div>
          </div>
          <div class="d-visual reveal d2">
            <img src="${esc(p.image)}" alt="${esc(p.title)} app screenshot" />
          </div>
        </div>

        ${p.results && p.results.length ? `
        <div class="d-stats reveal d3">
          ${p.results.map(r => `<div class="stat"><div class="stat-value">${esc(r.value)}</div><div class="stat-label">${esc(r.label)}</div></div>`).join('')}
        </div>` : ''}

        <div style="margin-top:30px"></div>
        ${section('overview', 'Overview', `<p>${esc(p.overview)}</p>`)}

        <div class="d-grid">
          ${p.tasks ? section('tasks', 'What I did', `<ul class="checklist">${p.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`) : ''}
          ${p.features ? section('features', p.featuresTitle || 'App features', `<ul class="checklist bullets">${p.features.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`) : ''}
        </div>

        ${section('tech', 'Tools & technologies', `<div class="tags">${p.tech.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`)}

        <div class="d-foot">
          <a class="btn" href="projects.html">${ICON.back} Back to projects</a>
        </div>`;
    }
  </script>
</body>
</html>
